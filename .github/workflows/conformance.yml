name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.txt

      - name: Verify vector integrity (CI check)
        run: python tools/bake_vector.py --check

      - name: Run conformance suite (local mode)
        run: python harness/harness.py --mode local

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Go clean-room implementation
        run: |
          cd hacp-go
          go build -o hacp-go .

      - name: Run conformance (Go clean-room, CLI mode)
        run: python harness/harness.py --mode cli --binary-path hacp-go/hacp-go
